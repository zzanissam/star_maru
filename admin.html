<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>별마루⭐ - [관리자용] 전설 & 이미지 관리자</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #000000;
      --panel-bg: rgba(10, 14, 26, 0.95);
      --card-bg: rgba(25, 33, 50, 0.85);
      --border-color: rgba(255, 255, 255, 0.15);
      --accent-yellow: #ffd166;
      --accent-blue: #4cc9f0;
      --accent-green: #06d6a0;
      --accent-red: #ff6b6b;
      --text-main: #ffffff;
      --text-sub: #cbd5e1;
    }

    html, body {
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #000000 !important;
      color: var(--text-main);
      font-family: 'Noto Sans KR', sans-serif;
      overflow: hidden !important;
    }

    body { display: flex; flex-direction: column; }

    header {
      width: 100%; height: 60px; padding: 0 24px;
      background: #0a0e1a !important; border-bottom: 1px solid var(--border-color);
      display: flex; justify-content: space-between; align-items: center;
      z-index: 20; flex-shrink: 0; box-sizing: border-box;
    }

    .logo h1 { font-size: 1.4rem; font-weight: 900; color: var(--accent-yellow); margin: 0; }
    .copyright-badge { font-size: 0.82rem; color: var(--accent-yellow); background: rgba(255, 209, 102, 0.1); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255, 209, 102, 0.3); font-weight: 600; }

    .app-body { flex: 1; width: 100%; height: calc(100vh - 60px); display: flex; position: relative; overflow: hidden; background: #000000 !important; }
    .sidebar { width: 380px; height: 100%; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 10; backdrop-filter: blur(10px); flex-shrink: 0; }
    .sidebar-content { flex: 1; padding: 20px; overflow-y: auto; }
    .section-title { font-size: 1.05rem; color: var(--accent-yellow); margin-bottom: 10px; margin-top: 15px; font-weight: 800; }
    
    .legend-form select, .legend-form textarea {
      width: 100%; padding: 10px; margin-top: 8px; background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border-color); border-radius: 8px; color: #fff; font-family: inherit; box-sizing: border-box; outline: none;
    }
    .legend-form textarea { height: 120px; resize: vertical; }

    .action-btn { width: 100%; padding: 10px; margin-top: 8px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem; }
    .btn-upload { background: var(--accent-yellow); color: #000; }
    .btn-copy { background: var(--accent-green); color: #000; }

    .main-viewport { flex: 1; height: 100%; padding: 20px; box-sizing: border-box; overflow-y: auto; background: #050811 !important; }
    .code-output-box { width: 100%; height: 350px; background: #0f172a; border: 1px solid var(--accent-blue); border-radius: 12px; padding: 16px; color: #4cc9f0; font-family: monospace; font-size: 0.85rem; box-sizing: border-box; white-space: pre-wrap; word-break: break-all; overflow-y: auto; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <h1>별마루⭐ <span style="font-size:0.9rem; color:var(--accent-red); font-weight:normal;">[관리자 편집용]</span></h1>
    </div>
    <div class="copyright-badge">
      🛠️ 전설 내용을 작성한 후 [배포용 코드 복사]를 눌러 index.html에 붙여넣으세요!
    </div>
  </header>

  <div class="app-body">
    <div class="sidebar">
      <div class="sidebar-content">
        <div class="section-title">📖 황도 12궁 전설 직접 작성하기</div>
        <p style="font-size:0.83rem; color:var(--text-sub); margin-bottom:12px;">별자리를 선택하고 전설을 작성한 후 저장 버튼을 누르면 배포용 코드가 자동 업데이트됩니다.</p>
        
        <div class="legend-form">
          <label style="font-size:0.82rem; font-weight:bold; color:var(--accent-yellow);">별자리 선택</label>
          <select id="zodiac-select" onchange="loadLegend()"></select>

          <label style="font-size:0.82rem; font-weight:bold; color:var(--accent-yellow); margin-top:12px; display:block;">전설 이야기 내용</label>
          <textarea id="legend-input" placeholder="전설 내용을 입력하세요."></textarea>

          <button class="action-btn btn-upload" onclick="saveLegend()">💾 임시 저장 및 코드 생성</button>
        </div>
      </div>
    </div>

    <div class="main-viewport">
      <h2 style="color:var(--accent-yellow); margin-top:0;">📋 배포용(index.html)에 붙여넣을 코드</h2>
      <p style="color:var(--text-sub); font-size:0.9rem;">아래 [코드 복사] 버튼을 누른 후, GitHub의 <code>index.html</code> 파일 안 <code>const zodiacList = [ ... ];</code> 자리에 그대로 덮어씌워주세요!</p>

      <button class="action-btn btn-copy" onclick="copyCode()" style="margin-bottom:14px; width:220px;">📋 배포용 코드 전체 복사</button>

      <div class="code-output-box" id="code-output"></div>
    </div>
  </div>

  <script>
    let zodiacList = [
      { name: "양자리 ♈", dateRange: "3월 21일 ~ 4월 19일", bestMonthIdx: 2, bestMonthText: "2026년 10월", skyDirection: "남쪽 높은 하늘", desc: "생일인 봄철 대신 가을 밤 22시경 남쪽 높은 하늘에서 빛납니다.", legend: "계모의 구박을 받던 헬레와 프릭소스 남매를 구하기 위해 제우스가 보낸 황금 털을 가진 날개 달린 양의 신화입니다." },
      { name: "황소자리 ♉", dateRange: "4월 20일 ~ 5월 20일", bestMonthIdx: 3, bestMonthText: "2026년 11월", skyDirection: "동쪽~남동쪽 하늘", desc: "생일에서 6개월 뒤인 11월 밤, 알데바란과 플레이아데스 성단이 또렷합니다.", legend: "신들의 왕 제우스가 아름다운 공주 에우로파에게 반해 흰 황소로 변신하여 바다를 건넌 사랑의 이야기입니다." },
      { name: "쌍둥이자리 ♊", dateRange: "5월 21일 ~ 6월 21일", bestMonthIdx: 4, bestMonthText: "2026년 12월", skyDirection: "동쪽 높은 하늘", desc: "여름철 낮 하늘에 숨었던 형제별이 12월 겨울 밤하늘을 수놓습니다.", legend: "우애가 깊었던 카스토르와 폴룩스 형제 이야기입니다. 카스토르가 죽자 폴룩스가 영생을 나누어 주어 별자리가 되었습니다." },
      { name: "게자리 ♋", dateRange: "6월 22일 ~ 7월 22일", bestMonthIdx: 5, bestMonthText: "2027년 1월", skyDirection: "남동쪽 하늘", desc: "한여름 생일날과 반대편인 1월 한겨울 밤 22시에 프레세페 성단이 나타납니다.", legend: "영웅 헤라클레스와 히드라의 전투 때, 히드라를 도우려다 헤라클레스의 발에 밟힌 불쌍한 게를 헤라 여신이 하늘에 올린 전설입니다." },
      { name: "사자자리 ♌", dateRange: "7월 23일 ~ 8월 22일", bestMonthIdx: 6, bestMonthText: "2027년 2월", skyDirection: "동쪽~남동쪽 하늘", desc: "8월 태양 빛에 가려지던 사자자리가 2월 밤에 장관을 이룹니다.", legend: "헤라클레스가 12가지 과업 중 첫 번째로 싸워 이겨낸 네메아 계곡의 식인 사자 신화입니다." },
      { name: "처녀자리 ♍", dateRange: "8월 23일 ~ 9월 22일", bestMonthIdx: 7, bestMonthText: "2027년 3월", skyDirection: "동쪽 하늘", desc: "가을 생일 대신 6개월 뒤인 3월 봄 밤하늘에서 스피카 별을 볼 수 있습니다.", legend: "풍요의 여신 데메테르의 딸 페르세포네가 저승의 왕 하데스에게 납치되었다가 돌아오는 봄의 계절 신화입니다." },
      { name: "천칭자리 ♎", dateRange: "9월 23일 ~ 10월 22일", bestMonthIdx: 8, bestMonthText: "2027년 4월", skyDirection: "남동쪽 낮은 하늘", desc: "10월 밤에는 안 보이지만 6개월 뒤인 4월 밤 22시경 떠오릅니다.", legend: "정의의 여신 아스트라이아가 인간의 선함과 악함을 공정하게 저울질할 때 사용하던 정의의 저울입니다." },
      { name: "전갈자리 ♏", dateRange: "10월 23일 ~ 11월 22일", bestMonthIdx: 9, bestMonthText: "2027년 5월", skyDirection: "남동쪽 지평선", desc: "11월의 반대편인 5월 초여름 밤 남쪽 하늘에서 안타레스가 붉게 빛납니다.", legend: "자만한 사냥꾼 오리온을 벌하기 위해 헤라 여신이 보낸 독전갈 신화입니다." },
      { name: "사수자리 ♐", dateRange: "11월 23일 ~ 12월 21일", bestMonthIdx: 10, bestMonthText: "2027년 6월", skyDirection: "남쪽 지평선 낮게", desc: "겨울철 태양 뒤에 숨어 있다가 6개월 뒤인 6월 여름 밤 은하수와 함께 보입니다.", legend: "인류에게 의술과 학문을 가르친 반인반마 켄타우로스족의 현자 케이론의 신화입니다." },
      { name: "염소자리 ♑", dateRange: "12월 22일 ~ 1월 19일", bestMonthIdx: 11, bestMonthText: "2027년 7월", skyDirection: "남동쪽 하늘", desc: "1월 생일 무렵과 정확히 반대인 7월 한여름 밤 22시경 선명하게 관측됩니다.", legend: "목신 판(Pan)이 괴물 티퐁을 피해 물속으로 도망치다 상반신은 염소, 하반신은 물고기로 변한 이야기입니다." },
      { name: "물병자리 ♒", dateRange: "1월 20일 ~ 2월 18일", bestMonthIdx: 0, bestMonthText: "2026년 8월", skyDirection: "남쪽 하늘", desc: "태양이 물병자리를 지나는 2월의 반대편인 8월 밤 22시에 가장 잘 보입니다.", legend: "신들의 연회장에서 물을 따르는 트로이의 아름다운 소년 가니메데스 전설입니다." },
      { name: "물고기자리 ♓", dateRange: "2월 19일 ~ 3월 20일", bestMonthIdx: 1, bestMonthText: "2026년 9월", skyDirection: "남쪽 하늘 높은 곳", desc: "태양이 가리는 3월 대신 6개월 뒤인 9월 밤하늘에서 감상할 수 있습니다.", legend: "아프로디테와 에로스 모자가 괴물을 피해 물고기로 변신해 서로를 끈으로 묶은 사랑 이야기입니다." }
    ];

    window.onload = () => {
      const saved = localStorage.getItem('star_admin_zodiac_list');
      if (saved) { zodiacList = JSON.parse(saved); }
      
      const select = document.getElementById('zodiac-select');
      zodiacList.forEach((z, idx) => {
        const opt = document.createElement('option');
        opt.value = idx; opt.innerText = z.name;
        select.appendChild(opt);
      });
      loadLegend();
      updateCodeOutput();
    };

    function loadLegend() {
      const idx = document.getElementById('zodiac-select').value;
      document.getElementById('legend-input').value = zodiacList[idx].legend;
    }

    function saveLegend() {
      const idx = document.getElementById('zodiac-select').value;
      zodiacList[idx].legend = document.getElementById('legend-input').value;
      localStorage.setItem('star_admin_zodiac_list', JSON.stringify(zodiacList));
      updateCodeOutput();
      alert(`✅ [${zodiacList[idx].name}] 전설이 임시 저장되었습니다. 오른쪽에 생성된 코드를 복사하세요!`);
    }

    function updateCodeOutput() {
      const codeStr = `const zodiacList = ${JSON.stringify(zodiacList, null, 2)};`;
      document.getElementById('code-output').innerText = codeStr;
    }

    function copyCode() {
      const codeText = document.getElementById('code-output').innerText;
      navigator.clipboard.writeText(codeText).then(() => {
        alert("📋 배포용 자바스크립트 코드가 클립보드에 복사되었습니다!\nGitHub의 index.html 파일 안에 붙여넣으세요.");
      });
    }
  </script>
</body>
</html>
